{{define "conn-list"}}{{$l:=.ConnList}}<nav class="listcol" aria-label="Connections">
<div class="listcol-head"><div class="row"><span>Connections</span><details class="connect-menu"><summary>+ Connect</summary><div class="menu">{{range $l.Connect}}<a href="{{.Href}}">{{.Label}}</a>{{end}}</div></details></div></div>
{{range $l.Items}}<a class="item{{if .Placeholder}} placeholder{{end}}" href="{{.Href}}" {{if .Active}}aria-current="page"{{end}}><span class="row"><span class="t">{{.Name}}</span><span class="k">{{.Kind}}</span></span>{{if .Host}}<span class="s">{{.Host}}</span>{{end}}<span class="s{{if .Warn}} warn{{end}}">{{.Status}}</span></a>{{end}}
</nav>{{end}}

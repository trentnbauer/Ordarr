# Ordarr version 1 collection; import using Import / subscribe.
# ONE collection, main MCU timeline. Movies and individual episodes share one order.
# Order: Disney+ main-story timeline as reproduced at:
# https://en.wikipedia.org/wiki/Marvel_Cinematic_Universe_timeline
# Episode numbering and series TVDB IDs: https://www.tvmaze.com/api
# I Am Groot S01E01 precedes Guardians Vol. 2, following the official timeline book.
# Spider-Man: Brand New Day is placed in 2028, before the adjacent VisionQuest block.
# Excluded: Loki/TVA, What If...?, Marvel Zombies, Deadpool & Wolverine,
# The Fantastic Four: First Steps, Your Friendly Neighborhood Spider-Man, X-Men '97,
# other alternate-universe franchises, documentaries and disputed-canon legacy shows.
# Agent Carter below is the 2013 One-Shot, not the separate ABC series.
# Full-story ordering is not a scene-by-scene chronology; concurrent stories and
# post-credit scenes can occur outside their block. Episodes unaired on the cutoff
# date are omitted. Provider IDs identify metadata, not availability in your library.

services:
  ordarr:
    image: ordarr:0.6.0-dev
    build: .
    ports:
      - "${ORDARR_BIND_IP:-127.0.0.1}:${ORDARR_PORT:-8080}:8080"
    environment:
      ORDARR_ADDR: 0.0.0.0:8080
      ORDARR_DATA_DIR: /data
      ORDARR_SECURE_COOKIES: ${ORDARR_SECURE_COOKIES:-false}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ordarr-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/local/bin/ordarr, healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
volumes:
  ordarr-data:
